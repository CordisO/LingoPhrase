<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcard Review – Airport</title>
  <link rel="stylesheet" href="../review/review.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=volume_up" />
  <script src="https://kit.fontawesome.com/e31b8a103c.js" crossorigin="anonymous"></script>

</head>
<body>
  <div class="flashcard-container">
    <div id="flashcard" class="flashcard" onclick="flipCard()">
      <div id="front">Where is the check-in counter?</div>
      <div id="back" class="hidden">
        <p class="thai-translation">เคาน์เตอร์เช็คอินอยู่ตรงไหนคะ</p>
        <p class="thai-romanization"><em>kao-ter check-in yùu dtrong-năi ká</em></p>
        <button class="audio-button" onclick="event.stopPropagation(); playAudio('checkin-counter')">
            <span class="material-symbols-outlined" style="font-size: 24px;" >
            volume_up
            </span> 
            </button>
        <audio id="audio-checkin-counter" src="../audio/thai/airport/checkin-counter.mp3"></audio>
      </div>
    </div>

    <button class="next-btn" onclick="nextCard()">Next ➜</button>
  </div>
  <script src="../review/review.js"></script>
</body>
