<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Language</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="language-body">
  <div class="language-container">
    <img src="images/intro_Avatar.svg" alt="Language Choice Avatar" />
    <h2>What would you like to learn today?</h2>
    <div class="button-group">
      <button onclick="location.href='scenarios-thai.html'" class="lang-btn thai">
        <img
          src="https://flagcdn.com/w20/th.png"
          srcset="https://flagcdn.com/w40/th.png 2x"
          width="20"
          alt="Thailand">
        Thai
      </button>
      <button onclick="location.href='scenarios-korean.html'" class="lang-btn korean">
        <img
          src="https://flagcdn.com/w20/kr.png"
          srcset="https://flagcdn.com/w40/kr.png 2x"
          width="20"
          alt="South Korea">
        Korean
      </button>
    </div>
  </div>
</body>
</html>
